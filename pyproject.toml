[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano"
version = "0.1.0"
description = "Small local coding agent for DeepSeek, OpenAI-compatible, Anthropic-compatible, and Ollama models"
requires-python = ">=3.10"
dependencies = [
    "bashlex>=0.18",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.4",
]

[project.scripts]
nano = "nano.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pyright>=1.1.400",
  "ruff>=0.4.4",
]

[tool.pyright]
include = ["nano"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.setuptools.packages.find]
include = ["nano*"]

[tool.setuptools.package-data]
nano = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
